name: Release BuildingBlocks

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build & Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Version from Tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"

      # Only restore and build BuildingBlocks projects (not HakuService template)
      - name: Restore BuildingBlocks
        run: |
          dotnet restore BuildingBlocks/BuildingBlocks.Domain/BuildingBlocks.Domain.csproj
          dotnet restore BuildingBlocks/BuildingBlocks.Application/BuildingBlocks.Application.csproj
          dotnet restore BuildingBlocks/BuildingBlocks.Infrastructure/BuildingBlocks.Infrastructure.csproj
          dotnet restore BuildingBlocks/BuildingBlocks.API/BuildingBlocks.API.csproj

      - name: Build BuildingBlocks
        run: |
          dotnet build BuildingBlocks/BuildingBlocks.Domain/BuildingBlocks.Domain.csproj --no-restore --configuration Release
          dotnet build BuildingBlocks/BuildingBlocks.Application/BuildingBlocks.Application.csproj --no-restore --configuration Release
          dotnet build BuildingBlocks/BuildingBlocks.Infrastructure/BuildingBlocks.Infrastructure.csproj --no-restore --configuration Release
          dotnet build BuildingBlocks/BuildingBlocks.API/BuildingBlocks.API.csproj --no-restore --configuration Release

      - name: Pack BuildingBlocks.Domain
        run: |
          dotnet pack BuildingBlocks/BuildingBlocks.Domain/BuildingBlocks.Domain.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: Pack BuildingBlocks.Application
        run: |
          dotnet pack BuildingBlocks/BuildingBlocks.Application/BuildingBlocks.Application.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: Pack BuildingBlocks.Infrastructure
        run: |
          dotnet pack BuildingBlocks/BuildingBlocks.Infrastructure/BuildingBlocks.Infrastructure.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: Pack BuildingBlocks.API
        run: |
          dotnet pack BuildingBlocks/BuildingBlocks.API/BuildingBlocks.API.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: List Packages
        run: ls -la ./nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/property-technology-solutions/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: BuildingBlocks v${{ steps.version.outputs.VERSION }}
          body: |
            ## 📦 BuildingBlocks v${{ steps.version.outputs.VERSION }}
            
            ### NuGet Packages
            - `Enterprise.BuildingBlocks.Domain` v${{ steps.version.outputs.VERSION }}
            - `Enterprise.BuildingBlocks.Application` v${{ steps.version.outputs.VERSION }}
            - `Enterprise.BuildingBlocks.Infrastructure` v${{ steps.version.outputs.VERSION }}
            - `Enterprise.BuildingBlocks.API` v${{ steps.version.outputs.VERSION }}
            
            ### Installation
            ```bash
            dotnet add package Enterprise.BuildingBlocks.Domain --version ${{ steps.version.outputs.VERSION }}
            dotnet add package Enterprise.BuildingBlocks.Application --version ${{ steps.version.outputs.VERSION }}
            dotnet add package Enterprise.BuildingBlocks.Infrastructure --version ${{ steps.version.outputs.VERSION }}
            dotnet add package Enterprise.BuildingBlocks.API --version ${{ steps.version.outputs.VERSION }}
            ```
            
            ### What's Changed
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            ./nupkgs/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Enterprise.BuildingBlocks.Domain | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Enterprise.BuildingBlocks.Application | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Enterprise.BuildingBlocks.Infrastructure | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Enterprise.BuildingBlocks.API | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
